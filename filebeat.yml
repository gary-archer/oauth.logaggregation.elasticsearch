filebeat.inputs:

#
# Receive API request logs with context and technical support data
#
- type: filestream
  enabled: true
  id: apirequest
  paths:
  - /var/log/api/request-*.log
  fields:
    logtype: 'request'
  parsers:
  - ndjson:
      keys_under_root: true
      add_error_key: false

#
# Receive API audit logs with context and security data
#
- type: filestream
  enabled: true
  id: apiaudit
  paths:
  - /var/log/api/audit-*.log
  fields:
    logtype: 'audit'
  parsers:
  - ndjson:
      keys_under_root: true
      add_error_key: false

#
# Configure ingestoion to indices
#
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_URL}"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  index: "api-%{[fields.logtype]}"
  pipeline: api

#
# Enable data streams with automatic removal of old data
#
setup:
  ilm:
    enabled: false
  template:
    enabled: false

#
# Generate the Elasticsearch _id from the logged id, and remove fields we do not want to query by
#
processors:
- fingerprint:
    fields: ["id"]
    target_field: "@metadata._id"
- drop_fields:
    fields: ['agent', 'ecs', 'host', 'input', 'version']

filebeat.inputs:

#
# Receive all API logs
#
- type: filestream
  enabled: true
  id: apirequest
  paths:
  - /var/log/api/*.log
  parsers:
  - ndjson:
      keys_under_root: true
      add_error_key: false

#
# Configure ingestion to the request log by default - for audit logs this gets overwritten by the ingestion pipeline
#
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_URL}"]
  username: "${ELASTICSEARCH_USERNAME}"
  password: "${ELASTICSEARCH_PASSWORD}"
  index: api-request
  pipeline: api

#
# Enable data streams with automatic removal of old data
#
setup:
  ilm:
    enabled: false
  template:
    enabled: false

#
# Generate the Elasticsearch _id from the logged id, and remove fields we do not want to query by
#
processors:
- fingerprint:
    fields: ["id"]
    target_field: "@metadata._id"
- drop_fields:
    fields: ['agent', 'ecs', 'host', 'input', 'version']
